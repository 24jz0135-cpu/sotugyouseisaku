<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OISO 解析結果の確認</title><link rel="stylesheet" href="style.css"></head>
<body><main><p class="eyebrow">OISO · PCから受信</p><h1>解析結果を確認する</h1>
<p>店名・日付・金額・科目をタップして修正できます。修正はこのスマホのブラウザーに保存されます。PCの元データは変わりません。</p>
<p id="receive-status" role="status">PCから受信しています…</p><button id="receive-retry" type="button">PCから再受信</button>
<p>作業後はCSVを保存してください。PCへ戻す場合は「スマホで確認したCSVを取り込む」から読み込みます。再受信しても修正済みの内容は上書きしません。</p>
<section><h2>明細</h2><p id="review-summary"></p><label>表示 <select id="review-filter"><option value="all">すべて</option><option value="pending">未確認</option><option value="confirmed">確認済み</option></select></label>
<p id="review-status" role="status"></p><div id="review-list"></div>
<nav><button id="review-prev">前へ</button><span id="review-page"></span><button id="review-next">次へ</button></nav>
<button id="review-export">確認済みをCSV保存</button><button id="review-backup">作業中の全件をCSV保存</button>
<details><summary>保存したCSVから再開</summary><label>解析CSVを読み込む<input id="review-import" type="file" accept=".csv,text/csv"></label></details></section>
</main><script src="review-data.js"></script><script src="review.js"></script><script src="receive.js"></script></body></html>
