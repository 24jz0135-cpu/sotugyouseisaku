<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>OISO | レシート管理</title>
  <style>
    :root{color-scheme:light;--ink:#102a43;--muted:#52677a;--line:#d8e2ea;--blue:#1769aa;--bg:#f4f8fb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(760px,calc(100% - 32px));margin:0 auto;padding:64px 0}
    .eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:8px 0 12px;font-size:clamp(34px,8vw,56px);line-height:1.1}p{color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:32px}
    a.card{display:block;padding:24px;border:1px solid var(--line);border-radius:18px;background:white;color:inherit;text-decoration:none;box-shadow:0 8px 24px #102a430a;transition:transform .15s,border-color .15s}
    a.card:hover{transform:translateY(-2px);border-color:#8ab9dc}a.card h2{margin:0 0 8px;font-size:21px}a.card p{margin:0 0 18px;font-size:14px}
    .open{color:var(--blue);font-weight:800}.note{margin-top:28px;padding:14px 16px;border-left:4px solid #7aaed2;background:#eaf3f9;border-radius:4px 10px 10px 4px;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">OISO</div>
    <h1>レシートを、<br>かんたんに管理。</h1>
    <p>使う端末に合わせて画面を選んでください。</p>
    <section class="cards" aria-label="アプリを選択">
      <a class="card" href="./smartphone/">
        <h2>スマートフォン版</h2>
        <p>レシートの撮影・保存と、PCへの送信を行います。</p>
        <span class="open">スマホ版を開く →</span>
      </a>
      <a class="card" href="./desktop/">
        <h2>PC版 OISO2</h2>
        <p>レシートの整理、解析結果の確認、申告準備用CSVの出力を行います。</p>
        <span class="open">PC版を開く →</span>
      </a>
    </section>
    <p class="note">GitHub Pagesのプレビューでは、画面表示や端末内での操作を利用できます。スマホとPCの連携、Discord送信、Bridge経由の解析には、別途サーバーやPC版Bridgeの起動が必要です。</p>
  </main>
</body>
</html>
