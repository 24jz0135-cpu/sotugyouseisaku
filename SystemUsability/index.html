<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Germany Flag</title>
  </head>
  <body>
    <!-- div4つでドイツ国旗（黒・赤・黄）を作る例 -->
    <div id="flag">
      <div class="stripe black"></div>
      <div class="stripe red"></div>
      <div class="stripe yellow"></div>
    </div>

    <!-- div4つでフランス国旗（青・白・赤）を作る例 -->
    <div id="flag-fr">
      <div class="stripe blue"></div>
      <div class="stripe white"></div>
      <div class="stripe red-fr"></div>
    </div>

    <!-- スウェーデン国旗（青地に黄の十字）例 -->
    <div id="flag-se">
      <div class="se-cross vertical"></div>
      <div class="se-cross vertical thin"></div>
      <div class="se-cross horizontal"></div>
      <div class="se-cross horizontal thin"></div>
    </div>

    <!-- div2つで日本の国旗（白地＋赤丸） -->
    <div id="flag-jp">
      <div class="jp-red-circle"></div>
    </div>

    <!-- div2つでノルウェーの国旗（赤地＋青の十字） -->
    <div id="flag-no">
      <div class="no-bg"></div>
      <div class="no-cross no-vertical"></div>
      <div class="no-cross no-horizontal"></div>
      <div class="no-cross no-vertical no-bgcut"></div>
      <div class="no-cross no-horizontal no-bgcut"></div>
    </div>


  </body>
</html>
